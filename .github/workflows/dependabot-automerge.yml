name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["*", "!Dependabot auto-merge"]
    types: [completed]

permissions: {}

jobs:
  automerge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      # This privileged workflow runs from the default branch, without checking out PR code.
      - id: verify
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const repo = context.repo, run = context.payload.workflow_run;
            const bot = user => user?.login === 'dependabot[bot]' && user?.id === 49699333;
            if (!bot(run.actor) || !bot(run.triggering_actor)) throw new Error('Unverified actor');
            const {data: repository} = await github.rest.repos.get(repo);
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,
              {...repo, commit_sha: run.head_sha, per_page: 100});
            const eligible = prs.filter(pr => bot(pr.user) && pr.state === 'open' &&
              pr.base.ref === repository.default_branch && pr.head.sha === run.head_sha &&
              pr.head.repo?.full_name === repository.full_name);
            if (eligible.length !== 1) return;
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: eligible[0].number});
            if (pr.draft || !bot(pr.user) || pr.head.sha !== run.head_sha || pr.state !== 'open') return;
            const commits = await github.paginate(github.rest.pulls.listCommits,
              {...repo, pull_number: pr.number, per_page: 100});
            // fetch-metadata checks the first commit; also verify every subsequent commit.
            if (!commits.length || commits.length !== pr.commits || commits.at(-1).sha !== pr.head.sha ||
                commits.some(c => !bot(c.author) || !c.commit.verification.verified ||
                  c.commit.verification.reason !== 'valid')) throw new Error('Unverified PR commits');
            const path = require('path').join(process.env.RUNNER_TEMP, 'dependabot-event.json');
            require('fs').writeFileSync(path, JSON.stringify({pull_request: pr, repository}));
            core.setOutput('event', path);
            core.setOutput('url', pr.html_url);
            core.setOutput('sha', pr.head.sha);

      - id: metadata
        if: steps.verify.outputs.url != ''
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        env:
          GITHUB_EVENT_PATH: ${{ steps.verify.outputs.event }}
        with:
          github-token: ${{ github.token }}
          skip-verification: false
          skip-commit-verification: false

      - name: Approve and auto-merge after all checks pass
        if: >-
          contains(fromJSON('["version-update:semver-major","version-update:semver-minor","version-update:semver-patch"]'),
            steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.verify.outputs.url }}
          HEAD_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_URL" --json bucket | jq -e 'length > 0 and all(.bucket == "pass")' > /dev/null
          test "$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
