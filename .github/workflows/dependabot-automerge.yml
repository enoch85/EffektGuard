name: Dependabot auto-merge
on: pull_request_target

permissions: {}

jobs:
  automerge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Approve and enable auto-merge
        if: >-
          contains(fromJSON('["version-update:semver-major","version-update:semver-minor","version-update:semver-patch"]'),
            steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" |
            jq -e --arg sha "$HEAD_SHA" --argjson count "$COMMIT_COUNT" '
              flatten | length == $count and length > 0 and last.sha == $sha and
              all(.author.login == "dependabot[bot]" and .author.id == 49699333 and
                .commit.verification.verified and .commit.verification.reason == "valid")' > /dev/null
          test "$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
          gh pr review --approve "$PR_URL"
          # GitHub enforces required checks and waits through failures and reruns.
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
