name: Validate

on:
  pull_request:
  push:
    branches: [main, initial-implementation]
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint EffektGuard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install the pinned formatter
        run: python -m pip install "$(sed -n '/^black==/p' tests/requirements.txt)"
      - run: black custom_components/effektguard/ --check --line-length 100
      - run: python scripts/check_hardcoded_values.py --check

  validate:
    name: Validate EffektGuard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q custom_components tests scripts
      - run: pytest tests/ -v --tb=short
      - run: python scripts/simulation/sim_harness.py --selftest
      - run: python scripts/simulation/sim_harness.py --dst
      - run: python scripts/simulation/sim_harness.py --all-scenarios
      # This integration has no web/Node build: its production build is the HACS ZIP.
      - name: Build and verify the HACS distribution
        run: |
          mkdir /tmp/effektguard-release
          cp -r custom_components/effektguard README.md LICENSE hacs.json /tmp/effektguard-release/
          (cd /tmp/effektguard-release && zip -qr /tmp/effektguard.zip . -x '*/__pycache__/*' '*.pyc')
          unzip -tq /tmp/effektguard.zip
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  infrastructure:
    name: Validate Automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow lint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl --fail --silent --show-error --location --output "/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output /tmp/actionlint-checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd /tmp && sha256sum --check --ignore-missing actionlint-checksums.txt)
          tar --no-same-owner -xzf "/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C /tmp actionlint
          /tmp/actionlint -color
      - run: node --test scripts/automation/*.test.cjs
      - name: Build development container
        run: docker build --file .devcontainer/Dockerfile --tag effektguard-dev:validation .
